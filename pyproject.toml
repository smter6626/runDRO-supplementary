[build-system]
requires = ["setuptools>=61", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastcircuits"
version = "0.1.0"
description = "Fast probabilistic circuits library (Cython)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "fastcircuits contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Cython",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
gcw = ["gurobipy>=11.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fastcircuits*"]

[tool.setuptools.package-data]
fastcircuits = ["*.pyi", "gcw.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gurobi: requires gurobipy and a valid Gurobi license",
    "pyjuice: requires pyjuice and torch",
]
